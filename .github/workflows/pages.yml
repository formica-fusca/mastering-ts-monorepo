# Builds the showcase site in app/ and publishes it to GitHub Pages.
# One-time setup in the repository settings: Pages → Source → "GitHub Actions".
# With the other source ("Deploy from a branch"), GitHub ALSO runs its own Jekyll
# build of the whole repo on every push ("pages-build-deployment"), which fails on
# this repo's committed symlinks. Set on 2026-11-01 via the Pages API (build_type=workflow).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from app/package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install (frozen lockfile — lesson 1.5)
        working-directory: app
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: app
        env:
          # Project site: served under https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
